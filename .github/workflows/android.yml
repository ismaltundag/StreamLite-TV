name: Build Android TV APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-tv-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: StreamLite-TV-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK for direct TV download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk StreamLite-TV.apk
          gh release view tv-latest >/dev/null 2>&1 || gh release create tv-latest --title "StreamLite TV - latest test build" --notes "Development APK for Philips Android TV. For testing only."
          gh release delete-asset tv-latest StreamLite-TV.apk --yes 2>/dev/null || true
          gh release upload tv-latest StreamLite-TV.apk
